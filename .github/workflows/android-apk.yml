name: android-apk

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle build type'
        type: choice
        options:
          - Release
          - Debug
        default: Release

permissions:
  contents: write

jobs:
  apk:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Map Repository Directories
        run: |
          echo "=== ROOT DIRECTORY ==="
          ls -R
          echo "=== SEARCHING FOR GRADLEW ==="
          find . -name "gradlew"
          echo "=== SEARCHING FOR BUILD SCRIPTS ==="
          find . -name "*.sh"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-failure-logs
          path: "**/build/reports/**/*"
