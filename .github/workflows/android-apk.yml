name: android-apk

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle build type'
        type: choice
        options:
          - Release
          - Debug
        default: Release

permissions:
  contents: write

jobs:
  apk:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compile Native Android Application
        run: |
          cd src/android
          chmod +x gradlew || true
          ./gradlew assemble${{ github.event.inputs.build_type }} \
            --no-daemon \
            --stacktrace \
            -Pandroid.injected.build.abi=arm64-v8a \
            -Dorg.gradle.warning.mode=none

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-Android-APK
          path: "**/build/outputs/apk/**/*.apk"

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-failure-logs
          path: "**/build/reports/**/*"
