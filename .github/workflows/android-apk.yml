
name: android-apk

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Build configuration
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
        default: Release

permissions:
  contents: read

jobs:
  apk:
    name: Lichii Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-36
            build-tools;36.0.0
            ndk;28.2.13676358
            cmake;3.31.5

      - name: Configure Android environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Lichii Android
        shell: bash
        run: |
          chmod +x .ci/android/build.sh

          .ci/android/build.sh \
            -r \
            -t standard \
            -b "${{ inputs.build_type }}"

      - name: Upload APK and AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-Android-ARM64
          path: |
            artifacts/*.apk
            artifacts/*.aab
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-Build-Logs
          path: |
            src/android/build/
            src/android/app/build/
            artifacts/
          if-no-files-found: warn
