
name: android-apk

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Gradle build type
        type: choice
        options:
          - Release
          - Debug
        default: Release

permissions:
  contents: read

jobs:
  apk:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f src/android/gradlew ]; then
            echo "ANDROID_DIR=src/android" >> "$GITHUB_ENV"
          elif [ -f android/gradlew ]; then
            echo "ANDROID_DIR=android" >> "$GITHUB_ENV"
          elif [ -f gradlew ]; then
            echo "ANDROID_DIR=." >> "$GITHUB_ENV"
          else
            echo "ERROR: No Android Gradle project found"
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          cd "$ANDROID_DIR"
          chmod +x gradlew

          set -o pipefail

          ./gradlew assemble${{ github.event.inputs.build_type }} \
            --no-daemon \
            --stacktrace \
            --info \
            --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/build-full.log"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-Android-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Diagnostics
          path: build-full.log
          if-no-files-found: warn
