name: android-apk

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle build type'
        type: choice
        options:
          - Release
          - Debug
        default: Release

permissions:
  contents: write

jobs:
  apk:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Fetch Working Android Structure
        run: |
          git clone --recursive https://github.com workspace
          mv workspace/* .
          mv workspace/.* . || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Pre-installed Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd src/android || cd android || cd .
          chmod +x gradlew
          ./gradlew assemble${{ github.event.inputs.build_type }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-Android-APK
          path: "**/build/outputs/apk/**/*.apk"
