name: android-apk

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle build type'
        type: choice
        options:
          - Release
          - Debug
        default: Release

permissions:
  contents: write

jobs:
  apk:
    name: Android arm64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          mkdir -p mkdir -p ${HOME}/android-sdk/cmdline-tools
          wget https://google.com -O tools.zip
          unzip -q tools.zip -d ${HOME}/android-sdk/cmdline-tools
          mv ${HOME}/android-sdk/cmdline-tools/cmdline-tools ${HOME}/android-sdk/cmdline-tools/latest
          rm tools.zip
          echo "ANDROID_HOME=${HOME}/android-sdk" >> $GITHUB_ENV
          echo "${HOME}/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Accept All Android SDK Licenses
        run: |
          yes | ${HOME}/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          cd src/android
          chmod +x gradlew
          ./gradlew assemble${{ github.event.inputs.build_type }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-Android-APK
          path: src/android/app/build/outputs/apk/**/*.apk
