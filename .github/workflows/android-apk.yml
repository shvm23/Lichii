name: android-apk

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Gradle build type'
        type: choice
        options:
          - Release
          - Debug
        default: Release

permissions:
  contents: write

jobs:
  apk:
    name: Android ARM64 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 100

    steps:
      - name: Fetch Working Android Structure
        run: |
          git clone --recursive https://github.com workspace
          cp -r workspace/* .
          cp -r workspace/.* . || true
          rm -rf workspace

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/26.1.10909125" >> $GITHUB_ENV
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK with Verbose Error Logging
        run: |
          cd android || cd app || cd .
          chmod +x gradlew || true
          ./gradlew assemble${{ github.event.inputs.build_type }} --stacktrace --info

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Lichii-Android-APK
          path: "**/build/outputs/apk/**/*.apk"

      - name: Upload diagnostic logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-failure-logs
          path: "**/build/reports/**/*"
